<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Readiness Hub 진단을 처음부터 결과와 실행까지 보여 주는 12개 가상 완성 사례"><title>완성 샘플 — Readiness Hub</title>
<link rel="stylesheet" href="../assets/legal.css"><style>
.notice{border:1px solid #d7a73a;border-left:4px solid #d7a73a;border-radius:9px;padding:11px;background:#fff8e6;color:#4b3500}.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.case{border:1px solid #ddd;border-radius:12px;padding:15px}.case h2{font-size:17px;margin:0 0 5px}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#edf3ff}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.score{background:#f5f5f2;border-radius:8px;text-align:center;padding:8px 3px;font-size:11px}.score b{display:block;font-size:18px}.case details{border-top:1px solid #ddd;padding-top:8px}.case summary{cursor:pointer;font-weight:750;min-height:38px;display:flex;align-items:center}.case li{margin:6px 0}.meta{font-size:12px;color:#666}
</style></head><body><a class="skip" href="#main">본문 바로가기</a><main id="main"><header class="hero"><p class="eyebrow">처음부터 재검증까지</p><h1>12개 완성 샘플</h1><p>내 서비스와 가까운 가상 사례를 골라 점수보다 행동 순서를 먼저 익힐 수 있습니다.</p></header><p class="notice"><b>중요:</b> 아래 서비스·점수·증거는 사용법 교육을 위한 가상 자료입니다. 실제 업체의 성과, 법률 준수 또는 출시 승인을 뜻하지 않습니다.</p>
<section id="cases" class="cases" aria-live="polite"><p>사례를 불러오는 중입니다.</p></section><nav><a href="../">이 사례처럼 진단 시작</a> · <a href="../m/">모바일에서 시작</a> · <a href="../glossary/">쉬운 용어집</a> · <a href="../help/">도움말</a></nav></main>
<script>(function(){var out=document.getElementById('cases');function e(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function score(label,value){return '<div class="score">'+e(label)+'<b>'+e(value)+'</b></div>'}fetch('../content/sample-cases-v1.json').then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(d){out.innerHTML=d.cases.map(function(x){var s=x.sampleScores||{};return '<article class="case"><h2>'+e(x.name)+'</h2><div class="badges"><span class="badge">'+e(x.archetype)+'</span><span class="badge">가상 사례</span></div><p>'+e(x.startState)+'</p><div class="scores">'+score('PC 웹',s.web==null?'미확인':s.web+'점')+score('모바일',s.mobile==null?'미확인':s.mobile+'점')+score('증거 진행',s.evidenceProgress==null?'미확인':s.evidenceProgress+'%')+'</div><details><summary>증거·상위 갭·완료 모습을 보기</summary><h3>학습용 증거</h3><ul>'+(x.evidence||[]).map(function(v){return '<li><b>'+e(v.itemId)+'</b> · '+e(v.tier)+' · '+e(v.observedAt)+' — '+e(v.note)+'</li>'}).join('')+'</ul><h3>먼저 고칠 3개</h3><ol>'+(x.topGaps||[]).map(function(v){return '<li>'+e(v.itemId)+' — '+e(v.action)+'</li>'}).join('')+'</ol><h3>완료 모습</h3><p>'+e(x.outcome)+'</p><p class="meta">'+e(x.learningNotes)+'</p></details></article>'}).join('')}).catch(function(){out.innerHTML='<p>사례 자료를 불러오지 못했습니다. 진단 값은 지워지지 않습니다. <a href="../help/states/">복구 방법 보기</a></p>'})})();</script></body></html>
