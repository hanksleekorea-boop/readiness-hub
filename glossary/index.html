<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Readiness Hub 출시 준비도 용어 120개를 쉬운 말로 찾는 용어집"><title>쉬운 용어집 — Readiness Hub</title>
<link rel="stylesheet" href="../assets/legal.css"><style>
.tools{position:sticky;top:0;background:var(--bg,#fff);padding:10px 0;z-index:2}.tools label{display:block;font-weight:750;margin-bottom:5px}.tools input{box-sizing:border-box;width:100%;min-height:46px;padding:10px 12px;border:1px solid #aaa;border-radius:9px;font:inherit}.count{color:#666;font-size:13px}.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.term{border:1px solid #ddd;border-radius:10px;padding:13px}.term h2{font-size:16px;margin:0 0 6px}.term p{margin:5px 0}.meta{font-size:12px;color:#666}.empty{padding:20px;border:1px dashed #aaa;border-radius:10px}
</style></head><body><a class="skip" href="#main">본문 바로가기</a><main id="main"><header class="hero"><p class="eyebrow">120개 쉬운 정의</p><h1>Readiness Hub 용어집</h1><p>어려운 출시·품질 표현을 실제 확인 행동과 연결해 설명합니다.</p></header>
<section class="tools" aria-label="용어 검색"><label for="q">찾을 말이나 영역</label><input id="q" type="search" placeholder="예: 복구, 개인정보, 접근성" autocomplete="off"><p id="count" class="count" aria-live="polite">자료를 불러오는 중입니다.</p></section>
<section id="terms" class="terms" aria-label="용어 목록"></section><noscript><p class="empty">용어 검색에는 JavaScript가 필요합니다. 콘텐츠 JSON은 <a href="../content/glossary-v1.json">여기서 직접 확인</a>할 수 있습니다.</p></noscript>
<nav><a href="../help/">도움말</a> · <a href="../samples/">완성 샘플</a> · <a href="../">PC 진단</a> · <a href="../m/">모바일 진단</a></nav></main>
<script>(function(){var all=[],q=document.getElementById('q'),out=document.getElementById('terms'),count=document.getElementById('count');function e(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function draw(){var needle=q.value.trim().toLowerCase(),rows=all.filter(function(x){return !needle||(x.term+' '+x.definition+' '+x.domain+' '+x.relatedItemId).toLowerCase().indexOf(needle)>=0});count.textContent='전체 '+all.length+'개 중 '+rows.length+'개';out.innerHTML=rows.length?rows.map(function(x){return '<article class="term"><h2>'+e(x.term)+'</h2><p>'+e(x.definition)+'</p><p class="meta">'+e(x.domain)+' · 점검 항목 '+e(x.relatedItemId)+'</p></article>'}).join(''):'<p class="empty">일치하는 용어가 없습니다. 더 짧은 말로 다시 찾아보세요.</p>'}q.addEventListener('input',draw);fetch('../content/glossary-v1.json').then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(d){all=d.terms||[];draw()}).catch(function(){count.textContent='용어 자료를 불러오지 못했습니다.';out.innerHTML='<p class="empty">입력한 진단 값에는 영향이 없습니다. 연결 후 새로고침하거나 <a href="../help/states/">복구 방법</a>을 확인하세요.</p>'})})();</script></body></html>
