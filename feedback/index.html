<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Readiness Hub 선택형 로컬 사용성 기록"><link rel="canonical" href="https://hanksleekorea-boop.github.io/readiness-hub/feedback/"><link rel="stylesheet" href="../assets/legal.css"><title>사용성 의견 기록 — Readiness Hub</title></head><body><main class="legal"><p class="eyebrow">기본 수집 안 함</p><h1>선택형 사용성 의견 기록</h1><div class="notice"><strong>입력 내용은 이 브라우저에만 저장됩니다.</strong><br>서버로 자동 전송하지 않습니다. 내려받은 파일을 직접 전달하기 전까지 운영자는 내용을 볼 수 없습니다.</div><p id="sampleStatus" role="status">실제 표본 0/5 · 표본 부족</p><label><input id="consent" type="checkbox"> 연구 원칙을 읽었고 로컬 기록에 동의합니다.</label><p><label>수행 과업 <select id="task"><option>퀵체크</option><option>진단</option><option>결과 해석</option><option>갭 실행</option><option>내보내기</option></select></label></p><p><label>완료 여부 <select id="completed"><option value="yes">완료</option><option value="no">미완료</option></select></label></p><p><label>막힌 지점 또는 의견 <textarea id="comment" rows="5" maxlength="1000"></textarea></label></p><p><button id="save" disabled>이 기기에 기록</button> <button id="download">기록 내려받기</button> <button id="erase">기록 삭제</button></p><div id="result" role="status"></div><p><a href="../privacy/">개인정보</a> · <a href="../support/">지원·문의</a> · <a href="../">서비스로 돌아가기</a></p></main><script>(function(){'use strict';var KEY='crh-research-log-v1',consent=document.getElementById('consent'),save=document.getElementById('save'),status=document.getElementById('sampleStatus'),result=document.getElementById('result');function rows(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){return[]}}function render(){var n=rows().length;status.textContent='실제 표본 '+n+'/5 · '+(n<5?'표본 부족':'최소 표본 충족')}consent.onchange=function(){save.disabled=!consent.checked};save.onclick=function(){if(!consent.checked)return;var list=rows();list.push({schema:'crh-research-log/v1',at:new Date().toISOString(),task:document.getElementById('task').value,completed:document.getElementById('completed').value,comment:document.getElementById('comment').value.trim()});localStorage.setItem(KEY,JSON.stringify(list));document.getElementById('comment').value='';result.textContent='이 기기에 기록했습니다.';render()};document.getElementById('download').onclick=function(){var list=rows(),blob=new Blob([JSON.stringify({schema:'crh-research-export/v1',exportedAt:new Date().toISOString(),sampleStatus:list.length<5?'insufficient':'minimum-met',entries:list},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='readiness-hub-research-log.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};document.getElementById('erase').onclick=function(){if(confirm('이 브라우저의 사용성 기록을 삭제할까요?')){localStorage.removeItem(KEY);result.textContent='기록을 삭제했습니다.';render()}};render()})();</script></body></html>
